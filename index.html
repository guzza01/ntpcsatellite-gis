<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新北市工程重機械智慧編管 GIS 儀表板</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet.js CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        #map {
            height: calc(100vh - 70px);
            z-index: 1;
        }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background-color: #1f2937 !important;
            color: #f3f4f6 !important;
            border: 1px solid #374151;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        /* 自訂地圖標記與文字標籤樣式 */
        .custom-machine-marker {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        .marker-icon-box {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            border: 2px solid #ffffff;
            transition: all 0.3s ease;
        }
        .marker-label {
            background-color: rgba(15, 23, 42, 0.85);
            color: #f8fafc;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            pointer-events: none;
            transition: all 0.3s ease;
        }

        /* 被選中時的高亮閃爍與放大效果 */
        .marker-active .marker-icon-box {
            transform: scale(1.3);
            box-shadow: 0 0 20px #38bdf8, 0 0 10px #ffffff;
            border-color: #38bdf8;
        }
        .marker-active .marker-label {
            background-color: rgba(14, 165, 233, 0.95);
            border-color: #7dd3fc;
            color: #ffffff;
        }

        /* 演練告警狀態脈衝動畫 */
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); }
            70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .marker-alert .marker-icon-box {
            animation: pulse-red 1.6s infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans overflow-hidden">

    <!-- 頂部導航列 (Header) -->
    <header class="h-[70px] bg-slate-900 border-b border-slate-800 px-6 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 p-2 rounded-lg text-white">
                <i class="fa-solid fa-satellite-dish text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide bg-gradient-to-r from-blue-400 to-teal-300 bg-clip-text text-transparent">
                    新北市工程重機械智慧編管與動態調度系統
                </h1>
                <p class="text-xs text-slate-400">新北市政府工務局工程科 | 星際調度員 (Satellite Emergency Dispatcher)</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <button id="simBtn" onclick="toggleSimulation()" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-2 shadow-lg shadow-red-900/40 transition-all border border-red-500">
                <i class="fa-solid fa-triangle-exclamation animate-bounce"></i>
                <span>模擬烏來斷網/山崩演練</span>
            </button>
            <div class="bg-slate-800 px-3 py-1.5 rounded-md border border-slate-700 text-xs text-slate-300">
                <i id="statusDot" class="fa-solid fa-circle text-emerald-400 text-[10px] mr-1"></i>
                <span id="statusText">系統狀態：常態編管中</span>
            </div>
        </div>
    </header>

    <!-- 主頁面布局：三欄式 -->
    <div class="grid grid-cols-12 h-[calc(100vh-70px)]">

        <!-- 左側面板：數據統計與機具清冊 (點擊可連動地圖) -->
        <div class="col-span-3 bg-slate-900/90 border-r border-slate-800 p-4 flex flex-col gap-3 overflow-y-auto z-10">
            
            <!-- 統計卡片 1 -->
            <div onclick="focusAllMachines()" class="bg-slate-800/60 hover:bg-slate-800 p-3 rounded-xl border border-slate-700/50 cursor-pointer transition-all group">
